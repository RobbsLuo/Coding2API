# nginx 反向代理：VPS 上的公网入口（TLS 终止 + 反代到 frp 映射出来的回环端口）。
#
# 链路：客户端 --443/TLS--> nginx --http--> 127.0.0.1:8000(frps 映射) --隧道--> Mac:8000
#
# 安装（Debian/Ubuntu）：
#     sudo apt install -y nginx certbot python3-certbot-nginx
#     sed 's/__TUNNEL_DOMAIN__/<你的域名>/g' deploy/nginx/coding2api.conf \
#         | sudo tee /etc/nginx/sites-available/coding2api.conf >/dev/null
#     sudo ln -sf /etc/nginx/sites-available/coding2api.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d <你的域名>      # 签发证书并自动配置续期
#
# 证书路径由 certbot 按域名生成：/etc/letsencrypt/live/<你的域名>/。
# 本文件放在 sites-enabled 下（Debian 的 nginx.conf 在 http 内 include 该目录），
# 因此下面只写 server 即可。
#
# ---------------------------------------------------------------- 登录限流
# limit_req_zone 只能写在 **http 段**，单个 sites-enabled 文件里写不了（nginx
# 会报 `directive is not allowed here`）。必须手工加到 /etc/nginx/nginx.conf
# 的 http { ... } 块内（Debian 在 `/etc/nginx/nginx.conf` 顶部）：
#
#     limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# 含义：按客户端 IP 计，10m 共享内存约存 16 万条状态，速率 10 次/分钟。
# 改完 `sudo nginx -t && sudo systemctl reload nginx`。缺这一段时下方
# `limit_req zone=login` 会让 nginx 启动失败（unknown limit_req zone），
# 属于「配置漏了立刻报错」而非静默失效。

server {
    listen 80;
    listen [::]:80;
    server_name __TUNNEL_DOMAIN__;

    # 仅用于 ACME http-01 挑战；其余一律跳 https。
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 可选：nginx >= 1.25.1 用 `http2 on;`，旧版用 `listen 443 ssl http2;`。
    # 这里不写死，避免在 1.24（Ubuntu 24.04 默认）上 nginx -t 失败。
    server_name __TUNNEL_DOMAIN__;

    # 不回显 nginx 版本号（响应头 Server 与错误页）：暴露具体版本等于给
    # 攻击者一份「该试哪些 CVE」的清单。
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__TUNNEL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TUNNEL_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # 只留 TLS1.3 之外的现代套件（TLS1.3 的套件由协议固定，ssl_ciphers 管不到）：
    # ECDHE + AEAD（AES-GCM / ChaCha20）且 PFS；剔除 CBC、RSA 密钥交换与 3DES。
    # 兼容面：iOS 12+、Android 7+、Chrome/Firefox/Edge 近 6 年版本全部覆盖。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # 关掉会话票据：票据用静态密钥加密，泄露该密钥即可解密**历史**会话
    # （前向保密在票据这一层失效）。代价是每次完整握手，对本项目（管理台 +
    # API 长连接）影响可忽略。
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 与应用的 BodySizeLimitMiddleware 对齐（默认 16MB）：nginx 默认 1m 会
    # **先于**应用返回 413，且错误页不是应用约定的 JSON 形状，客户端拿到的是
    # nginx 的 HTML。两侧同值才能让超限统一由应用裁决。
    client_max_body_size 16m;
    # /metrics 默认无鉴权（可选 METRICS_TOKEN，见 .env.example），公网入口直接摘掉，
    # 与 deploy/caddy/Caddyfile 同口径；需要时从宿主 127.0.0.1:8000 直取。
    location = /metrics { return 404; }

    # 登录端点限流：撞库/密码喷洒的成本从这里抬高。应用侧也有失败计数与
    # 退避（src/auth/throttle.py），nginx 这层是「在到达 Python 之前就拦住」，
    # 省 CPU 也省连接。
    #   burst=5  nodelay —— 允许瞬时 5 个突发（用户手抖连点、双标签页），
    #     不排队（nodelay），超出的立即 429（limit_req_status）；
    #   zone=login 由 /etc/nginx/nginx.conf 的 http 段声明，见文件顶部注释。
    # 注意：状态按 $binary_remote_addr 计，本链路 nginx 是唯一入口，地址真实；
    # 若前面再加一层 CDN/负载均衡，要改用 realip 模块还原后再限流。
    # 请求体上限沿用 server 级的 16m（应用侧对登录另限 8KB，形状由应用裁决）。
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 备份恢复例外：端点是 512MB（`webapp/limits.BACKUP_UPLOAD_LIMIT`），
    # 这里不单独放宽的话，公网入口下大库的「恢复备份」永远 413 且报的是
    # nginx 的 HTML 页。
    location = /api/backups/restore {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Host 必须原样透传：应用按 ALLOWED_HOSTS 校验 Host（防 DNS rebinding），
        # 改写 Host 会让所有请求 400 `invalid host header`。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 应用靠它判定会话 Cookie 的 Secure（见 src/webapp/security.py 的
        # session_cookie_secure）：少了它，https 入口下发的 Cookie 不带 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;

        # 聊天是 SSE 长流：必须关缓冲，否则 token 被攒在 nginx 里、客户端表现为
        # 「卡很久然后一次性全出」。读超时要盖过最长对话（应用侧非流式聚合上限
        # UPSTREAM_COMPLETE_TIMEOUT_SECONDS 默认 600s），否则长对话被 nginx 掐断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
