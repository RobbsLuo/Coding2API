# nginx 反向代理：VPS 上的公网入口（TLS 终止 + 反代到 frp 映射出来的回环端口）。
#
# 链路：客户端 --443/TLS--> nginx --http--> 127.0.0.1:8000(frps 映射) --隧道--> Mac:8000
#
# 安装（Debian/Ubuntu）：
#     sudo apt install -y nginx certbot python3-certbot-nginx
#     sed 's/__TUNNEL_DOMAIN__/<你的域名>/g' deploy/nginx/coding2api.conf \
#         | sudo tee /etc/nginx/sites-available/coding2api.conf >/dev/null
#     sudo ln -sf /etc/nginx/sites-available/coding2api.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d <你的域名>      # 签发证书并自动配置续期
#
# 证书路径由 certbot 按域名生成：/etc/letsencrypt/live/<你的域名>/。
# 本文件放在 sites-enabled 下（Debian 的 nginx.conf 在 http 内 include 该目录），
# 因此下面只写 server 即可。

server {
    listen 80;
    listen [::]:80;
    server_name __TUNNEL_DOMAIN__;

    # 仅用于 ACME http-01 挑战；其余一律跳 https。
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 可选：nginx >= 1.25.1 用 `http2 on;`，旧版用 `listen 443 ssl http2;`。
    # 这里不写死，避免在 1.24（Ubuntu 24.04 默认）上 nginx -t 失败。
    server_name __TUNNEL_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__TUNNEL_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TUNNEL_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 与应用的 BodySizeLimitMiddleware 对齐（默认 16MB）：nginx 默认 1m 会
    # **先于**应用返回 413，且错误页不是应用约定的 JSON 形状，客户端拿到的是
    # nginx 的 HTML。两侧同值才能让超限统一由应用裁决。
    client_max_body_size 16m;
    # 备份恢复例外：端点是 512MB（`webapp/limits.BACKUP_UPLOAD_LIMIT`），
    # 这里不单独放宽的话，公网入口下大库的「恢复备份」永远 413 且报的是
    # nginx 的 HTML 页。
    location = /api/backups/restore {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Host 必须原样透传：应用按 ALLOWED_HOSTS 校验 Host（防 DNS rebinding），
        # 改写 Host 会让所有请求 400 `invalid host header`。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 应用靠它判定会话 Cookie 的 Secure（见 src/webapp/security.py 的
        # session_cookie_secure）：少了它，https 入口下发的 Cookie 不带 Secure。
        proxy_set_header X-Forwarded-Proto $scheme;

        # 聊天是 SSE 长流：必须关缓冲，否则 token 被攒在 nginx 里、客户端表现为
        # 「卡很久然后一次性全出」。读超时要盖过最长对话（应用侧非流式聚合上限
        # UPSTREAM_COMPLETE_TIMEOUT_SECONDS 默认 600s），否则长对话被 nginx 掐断。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
