# macOS 日志轮转规则（newsyslog）
#
# 安装（需 root，newsyslog 只读 /etc/newsyslog.d/）：
#     ./scripts/install-newsyslog.sh          # 安装 + 立即生效
#     ./scripts/install-newsyslog.sh --uninstall
# 脚本会用本机当前用户与仓库实际路径替换下面的占位符后写入
# /etc/newsyslog.d/，因此克隆到任意目录 / 任意用户名都能直接用。
#
# 字段含义（newsyslog.conf(5)，已核 man page）：
#   logfilename  owner:group  mode  count  size(KB)  when  flags
#
#   size=10240     单文件超 10MB 即轮转
#   when=*         仅依据 size 轮转（不按时间）；磁盘占用只与总量相关
#   count=7        最多保留 7 份归档（不含当前日志）
#   flags=J        归档用 bzip2 压缩
#   flags=N        轮转后不发信号（进程以 >> 追加模式持有文件句柄，
#                  newsyslog 轮转后新文件同名，进程继续写入）
#
# 注意：日志路径必须与 launchd plist 的 StandardOutPath / StandardErrorPath
# 一致。改 plist 时同步改这里。
# 本仓库的 plist 把两路日志分别写 launchd.out.log / launchd.err.log，
# 因此这里给两条规则。

__PROJECT_ROOT__/logs/launchd.out.log  __LOG_OWNER__  644  7  10240  *  JN
__PROJECT_ROOT__/logs/launchd.err.log  __LOG_OWNER__  644  7  10240  *  JN
