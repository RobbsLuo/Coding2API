name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要打的版本号（如 v0.14.1，留空则跳过）'
        required: false
        default: ''

# GITHUB_TOKEN 自带 packages:write（README → Packages → GitHub Actions 权限），
# 无需额外 secret。跨仓库拉私有依赖时再补 PAT。
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 确定要发的 tag：tag push 用 github.ref_name，手动触发用 inputs.tag
      - id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "tag=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::没有 tag，跳过 publish"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: 跳过（无 tag）
        if: steps.meta.outputs.tag == 'skip'
        run: echo "skip publish"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.meta.outputs.tag != 'skip'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.meta.outputs.tag != 'skip'

      # tag 与 pyproject.toml 的 project.version 必须一致，否则镜像 tag 会与
      # /healthz 自报版本自相矛盾（v0.12.0、v0.13.0 就漏 bump 过）。
      - name: 校验 tag 与版本号一致
        if: steps.meta.outputs.tag != 'skip'
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          PYVER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          if [ -z "$PYVER" ]; then
            echo "::error::读不到 pyproject.toml 的 project.version"
            exit 1
          fi
          if [ "$TAG" != "v$PYVER" ]; then
            echo "::error::tag=$TAG 与 pyproject.toml 的 version=$PYVER 不一致，先补 chore(release)"
            exit 1
          fi
          echo "版本一致：$TAG"

      # 发版前必跑后端测试：手动触发的正式发版同样不能跳过，否则坏代码
      # 会绕过 CI 直接进 GHCR。前端由 Dockerfile 的 vite build 兜底，这里不重复。
      - name: 后端测试
        if: steps.meta.outputs.tag != 'skip'
        run: |
          uv sync --frozen
          uv run ruff check src tests scripts
          uv run pytest -q --cov=src --cov-report=term --cov-fail-under=100

      - name: Setup buildx
        if: steps.meta.outputs.tag != 'skip'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GHCR
        if: steps.meta.outputs.tag != 'skip'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.meta.outputs.tag != 'skip'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          # ghcr.io 用户名必须小写；robbsluo 已全小写
          # 两个 tag：语义版本 + latest（compose 里引用的是 :latest）
          tags: |
            ghcr.io/robbsluo/coding2api:${{ steps.meta.outputs.tag }}
            ghcr.io/robbsluo/coding2api:latest
          # 层缓存：同 commit 反复 push 直接命中，冷启动也能复用远端 cache
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
          # provenance 让 GHCR 在 Packages 页面显示构建来源
          provenance: true
          # 单架构（linux/amd64）够 GitHub Actions ubuntu-latest 跑；
          # Apple Silicon 用户需要 arm64 时改 platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
