# 公网部署覆盖文件（Docker）：在基础 compose 上叠一个 Caddy 入口。
#
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
#
# .env 新增：PUBLIC_DOMAIN（必填，域名或公网 IP；A / AAAA 记录已指向本机）、
# ACME_EMAIL（域名模式必填，Let's Encrypt 到期通知）、TLS_MODE（可选，
# acme 默认 / internal 自签）。详见 README「公网部署（Docker）」。
#
# 需要 Docker Compose ≥ 2.24（下方 `!override` 标签；老版本读不了会报错）。

services:
  coding2api:
    # 应用端口只绑宿主机回环：入口只能走 Caddy。绑 0.0.0.0 会留一条明文 http
    # 旁路（TRUST_PROXY 已开，直连还能伪造 XFF 绕过 Key 的 allowed_ips）。
    ports: !override
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    # 只接专用后端网络：固定子网才能把 TRUSTED_PROXIES 收窄到一个 /24。
    networks:
      - backend
    environment:
      # PUBLIC_BASE_URL 决定 TRAE 登录回调基址与 HSTS 下发；https 才发 HSTS。
      # 它的主机名也自动进入 Host 白名单（ALLOWED_HOSTS 留空时的口径）。
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env (domain, or public IP with TLS_MODE=internal)}
      # 前恰好一层 Caddy 且应用端口只在回环 → 采信 XFF 是安全的。
      # TRUSTED_PROXIES 必须**精确到本 compose 的后端子网**，不能写 RFC1918
      # 全域（172.16/12、10/8、192.168/16）：那等于「任何同网段容器」都被采信，
      # 谁加入该网段就能自带 X-Forwarded-For 伪造来源 IP，绕过 Key 的
      # allowed_ips 与登录限流桶（src/auth/access.py 对命中白名单的对端直接取
      # entries[-1]）。下方 networks.backend.ipam 把子网钉死为 172.31.250.0/24。
      TRUST_PROXY: "true"
      TRUSTED_PROXIES: "172.31.250.0/24"
      # 上面两项是本文件的硬前提（没有 Caddy 就没有入口）：开启强制校验后，
      # 谁把 TRUSTED_PROXIES 误删/写坏，应用会启动即失败而不是静默降级到
      # 「采信任意对端的 XFF」。
      REQUIRE_TRUSTED_PROXIES: "true"
      # Caddy 反代走 compose 网络，容器内必须监听 0.0.0.0；.env 里沿用
      # .env.example 的 HOST=127.0.0.1 会让容器只监听回环、Caddy 连不上。
      HOST: 0.0.0.0
      # 显式列全：非空即「完全替换」语义——若 .env 里已有 ALLOWED_HOSTS，
      # 不补这一条会漏掉域名（全站 400 invalid host header）；漏掉回环地址
      # 会让容器 healthcheck 打的 127.0.0.1 判 400 → 永远 unhealthy
      # （Caddy 依赖应用 healthy，也就永远不启动）
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-},${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env},127.0.0.1,localhost

  caddy:
    # tag 保留（人读版本）+ digest 固定（构建可复现，与 Dockerfile 的三个基础
    # 镜像同口径）。digest 是 2.11.7-alpine 多架构索引（linux/amd64+arm64）的
    # 快照：sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    # 升级版本时用 `docker buildx imagetools inspect caddy:<tag>` 取新 digest。
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    container_name: coding2api-caddy
    restart: unless-stopped
    # 只接专用后端网络（同上）。
    networks:
      - backend
    # ---- 最小权限加固 ----
    # Caddy 需要绑 80/443（特权端口）→ 只补 NET_BIND_SERVICE，其余全丢。
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    # 512m 是保守默认（正常 RSS < 100MB；证书签发/大量并发握手时略高）。
    mem_limit: 512m
    # user 刻意不改：Caddy 以 root 起，内部会自行降权到 caddy 用户处理请求，
    # 且必须能写 /data（证书、ACME 账号）与 /config（autosave.json）。改成非
    # root 需要先给两个具名卷 chown 到该 uid（卷首次创建时属主是 root），
    # 否则启动即报 permission denied、证书永远签不下来。
    # 应用 healthy 后再起入口：否则 Caddy 会在应用预热期持续 502 并刷日志
    depends_on:
      coding2api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN in .env (domain, or public IP with TLS_MODE=internal)}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # acme（默认）：站点地址是域名 → 自动申请 / 续期；ACME_EMAIL 必填。
      # internal：站点地址是公网 IP → 用 Caddy 自带 CA 自签（浏览器告警）。
      TLS_MODE: ${TLS_MODE:-acme}
      PORT: ${PORT:-8000}
    ports:
      # 80：ACME HTTP-01 挑战 + 之后 308 跳 https；443/udp 是 HTTP/3
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # 整个目录挂进去：站点块按 TLS_MODE import tls_{$TLS_MODE}.caddyfile
      - ./deploy/caddy:/etc/caddy:ro
      # 证书、ACME 账号与 Caddy 状态：必须持久化，否则每次重建都重新签发
      - caddy_data:/data
      - caddy_config:/config
    # 与 coding2api 同口径的日志轮转（json-file 默认无上限）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:

networks:
  # 专用后端网络，子网钉死：TRUSTED_PROXIES 要精确到 /24，而 compose 默认
  # 网络的子网由 Docker 随机分配（10.x/172.x 都可能），无法在配置里引用。
  # 172.31.250.0/24 取自 RFC1918 尾部，避开 Docker 默认 bip 池
  # （172.17–172.31 的常见分配）与本机常见 VPN 网段；若宿主已有同网段冲突，
  # 改成任意未被占用的 /24，并同步 TRUSTED_PROXIES。
  backend:
    ipam:
      config:
        - subnet: 172.31.250.0/24
