[project]
name = "coding2api"
version = "0.10.0"
description = "把 CodeBuddy（国内站 + 国际）、TRAE SOLO、OpenCode Zen、Kilo、Qoder、CodeArts、OfficeAce 八个上游渠道统一封装为 OpenAI / Responses / Anthropic 兼容 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "defusedxml>=0.7.1",
    "fastapi>=0.115",
    "httpx[socks]>=0.28",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
]

[project.scripts]
coding2api = "src.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "real_upstream: 该文件允许真实访问上游（Zen 探活 / Kilo 清单 / OpenRouter 目录）；conftest 的 autouse 夹具据此跳过网络 stub（仅 zen / kilo / benchmarks 使用）",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI 的 Depends() 默认参数写法是官方推荐的，B008 为误报
ignore = ["B008"]

[tool.bandit]
# B608（SQL 字符串拼接）在本仓全部是**白名单拼接**：分组键过 `_GROUP_KEYS`、
# 排序走 `sql_order`、backfill 是字面量列名，值一律参数化。逐处 `# nosec`
# 只会让 15 个真实告警被噪声淹没，故在配置层统一关闭并在此留档；新增拼接点
# 仍须过白名单（见 tests/stats/test_query.py::test_group_methods_reject_*）。
skips = ["B608"]

