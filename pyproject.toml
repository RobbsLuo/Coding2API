[project]
name = "coding2api"
version = "0.1.2"
description = "把 CodeBuddy 与 TRAE SOLO 上游通道统一封装为 OpenAI 兼容 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
]

[project.scripts]
coding2api = "src.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "@abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI 的 Depends() 默认参数写法是官方推荐的，B008 为误报
ignore = ["B008"]
